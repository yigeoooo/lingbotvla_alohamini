# Starter LingBot-VLA post-training config for AlohaMini 2 Pro.
#
# Keep this file close to upstream configs/vla/real_load20000h.yaml and override
# paths from the command line. The fields below are the adapter-specific values.

model:
  model_path: robbyant/lingbot-vla-4b
  tokenizer_path: Qwen/Qwen2.5-VL-3B-Instruct

data:
  datasets_type: vla
  data_name: alohamini2pro
  train_path: path_to_dataset
  norm_stats_file: norm_path
  img_size: 224
  joints:
    - arm.position: 14
    - effector.position: 2
    - base.velocity: 3
    - lift.position: 1
  cameras:
    - camera_chest
    - camera_wrist_left
    - camera_wrist_right
  num_workers: 8
  norm_type: meanstd


train:
  output_dir: output/alohamini2pro
  data_parallel_mode: fsdp2
  enable_full_shard: false
  module_fsdp_enable: true
  use_compile: true
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: false
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 5.0e-5
  lr_decay_style: constant
  micro_batch_size: 8
  gradient_accumulation_steps: 1
  max_steps: 40000
  ckpt_manager: dcp
  save_steps: 10000
  save_epochs: 0
  enable_fp32: true
  enable_resume: true
