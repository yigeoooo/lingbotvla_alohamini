[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingbotvla-alohamini"
version = "0.1.0"
description = "AlohaMini2Pro adapter project for LingBot-VLA training and deployment."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
am2pro-verify-dataset = "lingbotvla_alohamini.verify_dataset:main"
am2pro-infer-lingbot = "lingbotvla_alohamini.infer_robot:main"

